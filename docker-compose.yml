services:
  postgres:
    image: postgres:16-alpine
    container_name: simply-do-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: simply_do
      POSTGRES_PASSWORD: simply_do
      POSTGRES_DB: simply_do
    ports:
      - "5432:5432"
    volumes:
      - simply-do-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simply_do"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  simply-do-pgdata:
